<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture Product Grid</title>
</head>
<body>
  <main>
    <h1>Product Grid Fixture</h1>
    <section aria-label="Featured products">
      <article>
        <h2>Product A</h2>
        <a href="/products/a">View details</a>
        <button>Add to cart</button>
        <button aria-label="Add Product A to compare">Compare</button>
      </article>
      <article>
        <h2>Product B</h2>
        <a href="/products/b">View details</a>
        <button>Add to cart</button>
        <button aria-label="Add Product B to compare">Compare</button>
      </article>
    </section>
    <div role="status" aria-live="polite"></div>
  </main>
</body>
</html>
