<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture Form Validation</title>
</head>
<body>
  <a href="#main">Skip to content</a>
  <main id="main">
    <h1>Checkout Contact Form</h1>

    <div role="status" aria-live="polite"></div>
